# Mises a jour de dependances.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# `groups` regroupe les mises a jour en une PR au lieu d'une par paquet — un
# seul lockfile modifie, donc aucun conflit entre PRs.
# Les majeures forment un groupe distinct : noyees parmi les mineures, une
# rupture d'API passerait inapercue.
#
# Les correctifs de securite ne suivent PAS ce calendrier : ils sont declenches
# par avis, des publication.

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      devcontainers:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # @types/node doit suivre la ligne majeure de Node reellement executee
      # (.nvmrc), pas la derniere publiee : des types plus recents decrivent des
      # APIs absentes du runtime, et le typecheck les accepte sans rien signaler.
      # Retirer cette regle en meme temps qu'une montee de .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

      # typescript 7 et eslint 10 ne sont pas consommables tant que
      # typescript-eslint ne les supporte pas : `eslint .` s'arrete des le
      # chargement du module sur « typescript-eslint does not support TS 7.0 ».
      # La PR arrivait rouge a chaque cycle, sans qu'aucun correctif de notre
      # cote ne puisse la rendre verte.
      #
      # Les MOTIFS couvrent la famille entiere, pas seulement le paquet racine :
      # nommer `eslint` seul laissait passer `@eslint/js` 10, qui suit la meme
      # contrainte de version. Un nom exact oblige a rattraper chaque paquet
      # apres coup — et chaque correction du present fichier declenche un
      # nouveau scan Dependabot, donc une nouvelle vague de PR.
      #
      # Retirer ces regles ENSEMBLE quand typescript-eslint publie son support :
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        patterns: ['*']
        update-types: ['major']
